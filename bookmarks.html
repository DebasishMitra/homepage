<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    body {
      justify-content: center;
      align-items: center;
    }
    .manager-container {
      width: 90%;
      max-width: 1000px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      position: relative;
    }
    .manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .manager-body {
      display: flex;
      flex: 1;
      gap: 2rem;
      min-height: 0;
    }
    .category-sidebar {
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-right: 1px solid var(--panel-border);
      padding-right: 1.5rem;
      overflow-y: auto;
    }
    .category-sidebar::-webkit-scrollbar { width: 6px; }
    .category-sidebar::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
    
    .category-btn {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .category-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .category-btn.active {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--accent-color);
      color: var(--accent-color);
      font-weight: 600;
    }
    .category-badge {
      background: var(--panel-bg);
      color: var(--text-secondary);
      font-size: 0.75rem;
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
    }
    .category-btn.active .category-badge {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }
    .bookmarks-content {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      grid-auto-rows: min-content;
      gap: 1rem;
      overflow-y: auto;
      padding-right: 0.5rem;
      align-content: start;
    }
    .bookmarks-content::-webkit-scrollbar { width: 6px; }
    .bookmarks-content::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
    
    .bookmark-grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.5rem 1rem;
      background: var(--bg-color);
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      transition: border-color var(--transition-fast), transform var(--transition-fast);
      position: relative;
    }
    .bookmark-grid-item:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }
    .b-icon {
      font-size: 1.75rem;
      width: 56px;
      height: 56px;
      background: var(--panel-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    .b-details {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      width: 100%;
    }
    .b-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .b-url {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
    .b-actions {
      display: flex;
      gap: 0.25rem;
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      opacity: 1;
      transition: background var(--transition-fast);
    }
    .b-actions button {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast), border-color var(--transition-fast);
      cursor: pointer;
    }
    .b-actions button:hover {
      color: #ef4444;
      border-color: #ef4444;
    }
    .add-category-input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-color);
      border: 1px dashed var(--panel-border);
      color: var(--text-primary);
      border-radius: 8px;
      outline: none;
      margin-top: 1rem;
      transition: all var(--transition-fast);
    }
    .add-category-input:focus {
      border-color: var(--accent-color);
      border-style: solid;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    #empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
  </style>
  <script type="module" crossorigin src="./assets/bookmarks-w28PW8Km.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-Bm_jTLyY.js">
  <link rel="modulepreload" crossorigin href="./assets/dialogs-DaSADX0q.js">
  <link rel="stylesheet" crossorigin href="./assets/auth-C30fz60P.css">
</head>
<body>
  <div class="solid-panel manager-container">
    <a href="/" class="icon-btn" style="position:absolute; top: 1.5rem; right: 1.5rem;" title="Back to Home"><i data-lucide="x"></i></a>
    
    <div class="manager-header">
      <h2 style="display:flex; align-items:center; gap:0.75rem; font-size:1.5rem; font-weight:700;">
        <i data-lucide="bookmark-plus" style="width:28px;height:28px;color:var(--accent-color);"></i> Bookmark Manager
      </h2>
      <div style="display:flex; gap: 0.5rem; margin-right: 2rem;">
        <input type="file" id="import-input" style="display:none;" accept=".json,.html">
        <button class="waffle-btn" id="import-btn" style="width:auto; padding: 0.5rem 1rem;">
          <i data-lucide="upload"></i> Import
        </button>
        <button class="waffle-btn" id="export-btn" style="width:auto; padding: 0.5rem 1rem;">
          <i data-lucide="download"></i> Export
        </button>
        <button class="waffle-btn" id="add-bookmark-btn" style="width:auto; padding: 0.5rem 1rem;">
          <i data-lucide="plus"></i> Add Bookmark
        </button>
      </div>
    </div>

    <div class="manager-body">
      <!-- Sidebar Categories -->
      <div class="category-sidebar">
        <div id="category-list" style="display:flex; flex-direction:column; gap:0.5rem;">
          <!-- JS Rendered -->
        </div>
        <form id="add-category-form">
          <input type="text" id="new-category-name" class="add-category-input" placeholder="+ New Category..." required autocomplete="off" />
        </form>
      </div>

      <!-- Main Content Bookmarks in selected category -->
      <div class="bookmarks-content" id="bookmarks-list-container">
        <!-- JS Rendered -->
      </div>
    </div>
  </div>
  
</body>
</html>
